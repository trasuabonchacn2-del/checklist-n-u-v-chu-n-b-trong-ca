<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist nấu &amp; chuẩn bị trong ca</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ee;--surf:#fff;--ink:#1f2a24;--mute:#6b7670;--line:#d9ddd6;--acc:#2f6f4f;--acc-s:#dcebe2;--warn:#c9822b;--row:#f1f3ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a17;--surf:#1d2420;--ink:#e8ede9;--mute:#97a39b;--line:#323c36;--acc:#5fb98b;--acc-s:#23382d;--warn:#e0a24f;--row:#222a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a17;--surf:#1d2420;--ink:#e8ede9;--mute:#97a39b;--line:#323c36;--acc:#5fb98b;--acc-s:#23382d;--warn:#e0a24f;--row:#222a25;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.nav{display:flex;align-items:center;gap:6px}
button{font:inherit;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.month{min-width:130px;text-align:center;font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:8px}
.d{flex:0 0 auto;width:46px;padding:6px 0 5px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer;position:relative}
.d b{display:block;font-size:15px}.d small{color:var(--mute);font-size:11px}
.d i{display:block;height:4px;margin:4px 6px 0;border-radius:2px;background:var(--line);overflow:hidden}
.d i span{display:block;height:100%;background:var(--acc)}
.d.sel{background:var(--acc);border-color:var(--acc);color:#fff}.d.sel small{color:#e3f1e9}.d.sel i{background:rgba(255,255,255,.35)}.d.sel i span{background:#fff}
.d.today{box-shadow:0 0 0 2px var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 span{font-weight:400;color:var(--mute);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:430px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:13px;font-weight:600;background:var(--row);position:sticky;top:0}
th button{font-size:11px;padding:1px 6px;margin-top:3px;display:block;margin-inline:auto;color:var(--mute)}
td:first-child,th:first-child{text-align:left}
tbody tr:nth-child(even) td{background:var(--row)}
td.rev{background:var(--acc-s)!important}
td.rev input{width:100%;min-width:78px;font:inherit;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--surf);color:var(--ink);margin:1px 0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);cursor:pointer}
.sl{font-size:12px;color:var(--mute);text-align:left!important}
.stats{padding:14px}
.big{font-size:30px;font-weight:700;line-height:1}
.shift{margin-top:12px}.shift .t{display:flex;justify-content:space-between;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--acc)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{margin-top:10px}
.miss{margin-top:10px;font-size:13px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;padding:14px 14px 0}
.chart div{flex:1;background:var(--acc-s);border-radius:3px 3px 0 0;min-height:2px;position:relative;cursor:pointer}
.chart div span{position:absolute;inset:auto 0 0 0;background:var(--acc);border-radius:3px 3px 0 0}
.chart div.sel{outline:2px solid var(--warn)}
.axis{display:flex;justify-content:space-between;padding:4px 14px 12px;font-size:11px;color:var(--mute)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:12px;color:var(--mute);padding:8px 14px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Checklist nấu &amp; chuẩn bị trong ca</h1><div class="sub">Đánh dấu sau khi hoàn tất. Cuối ca ghi doanh thu / số tờ note (VD: 2.500.000 / 45)</div><div class="sub" id="status"></div></div>
 <div class="nav"><button id="prev" aria-label="Tháng trước">‹</button><div class="month" id="mlabel"></div><button id="next" aria-label="Tháng sau">›</button></div>
</header>
<div class="days" id="days"></div>
<div class="grid">
 <div class="card">
  <h2><span style="color:var(--ink);font-weight:600" id="dtitle"></span><span id="dsum"></span></h2>
  <div class="scroll"><table>
   <thead><tr><th>Nội dung</th></tr></thead>
   <tbody id="body"></tbody>
  </table></div>
  <div class="hint">Dữ liệu được lưu trên Firebase và cập nhật trực tiếp cho mọi người đang mở trang.</div>
 </div>
 <div>
  <div class="card"><h2>Thống kê ngày <span id="sdate"></span></h2><div class="stats" id="dstats"></div></div>
  <div class="card" style="margin-top:14px"><h2>Cả tháng <span id="msum"></span></h2>
   <div class="chart" id="chart"></div><div class="axis"><span>1</span><span id="lastd"></span></div>
   <div class="stats" style="padding-top:0" id="mstats"></div>
  </div>
  <div class="tools"><button id="clr">Xoá dữ liệu ngày này</button><button id="exp">Tải CSV tháng</button></div>
 </div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var ITEMS=["Cốt trà sữa truyền thống","Cốt trà sữa Oolong","Cốt lục trà sữa","Lục trà","Hồng trà","Cốt trà bí đao","Nước đường trắng","Nước đường cà phê","Kem trứng","Machiato","Phô mai viên","Thạch phô mai cà phê","Thạch trà đào","Sương sáo","Pudding trứng / socola","Panna cotta","Khúc bạch nguyên vị","Khúc bạch phô mai","Khúc bạch trà xanh","Trân châu đen","Nha đam","Thạch trà xanh","Trân châu trắng","Trân châu hoàng kim","Hạt chia ngâm","Hạt đác rim","Dưa lưới ủ đường","Mứt măng cầu xiêm","Sốt khoai môn"];
var SH=["Ca sáng","Ca trưa","Ca chiều","Ca khuya"], N=ITEMS.length, WD=["CN","T2","T3","T4","T5","T6","T7"];
var store={}, KEY="checklist-ca-v1", db=null, unsub=null;
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){store={}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function setStatus(t,ok){var e=document.getElementById("status");if(e){e.textContent=(ok?"● ":"○ ")+t;e.style.color=ok?"var(--acc)":"var(--mute)"}}
function del(){return db?firebase.firestore.FieldValue.delete():null}
function norm(d){return {c:d.c||{},rev:d.rev||{},note:d.note||{}}}
function push(k,patch){
 saveLocal();
 if(!db||!firebase.auth().currentUser)return;
 db.collection("days").doc(k).set(patch,{merge:true}).catch(function(e){setStatus("Không ghi được: "+e.code,false)});
}
function initFB(){
 var cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.apiKey||cfg.apiKey.indexOf("DAN_")===0||typeof firebase==="undefined"){setStatus("Chế độ offline: chưa cấu hình Firebase, dữ liệu chỉ lưu trên máy này",false);return}
 try{
  firebase.initializeApp(cfg);db=firebase.firestore();
  firebase.auth().signInAnonymously().catch(function(e){setStatus("Chỉ xem được (đăng nhập ẩn danh lỗi: "+e.code+")",false)});
  setStatus("Đang kết nối…",false);listen();
 }catch(e){db=null;setStatus("Lỗi cấu hình Firebase",false)}
}
function listen(){
 if(!db)return;if(unsub)unsub();
 var FP=firebase.firestore.FieldPath;
 unsub=db.collection("days").where(FP.documentId(),">=",key(cy,cm,1)).where(FP.documentId(),"<=",key(cy,cm,dim(cy,cm)))
 .onSnapshot(function(snap){
  snap.docChanges().forEach(function(ch){if(ch.type==="removed")delete store[ch.doc.id];else store[ch.doc.id]=norm(ch.doc.data())});
  saveLocal();setStatus("Đã đồng bộ, mọi người cùng xem một dữ liệu",true);
  var a=document.activeElement;
  if(a&&a.tagName==="INPUT"&&a.type!=="checkbox"){renderDays();renderStats()}else render();
 },function(e){setStatus("Lỗi đồng bộ: "+e.code,false)});
}
var now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
function p2(n){return n<10?"0"+n:""+n}
function key(y,m,d){return y+"-"+p2(m+1)+"-"+p2(d)}
function get(k){return store[k]||(store[k]={c:{},rev:{},note:{}})}
function peek(k){return store[k]||null}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function cnt(rec,s){if(!rec)return 0;var n=0;for(var i=0;i<N;i++)if(rec.c[i+"-"+s])n++;return n}
function pct(rec){if(!rec)return 0;var t=0;for(var s=0;s<4;s++)t+=cnt(rec,s);return t/(N*4)*100}
function money(n){return n?n.toLocaleString("vi-VN")+" đ":"0 đ"}
function num(s){return parseInt(String(s).replace(/\D/g,""),10)||0}
function revOf(rec){if(!rec)return 0;var t=0;for(var s=0;s<4;s++)t+=num(rec.rev[s]);return t}
function fmtIn(el){var n=num(el.value);el.value=n?n.toLocaleString("vi-VN"):""}

function buildHead(){
 var tr=document.querySelector("thead tr");
 tr.innerHTML="<th>Nội dung</th>";
 SH.forEach(function(n,s){var th=document.createElement("th");th.innerHTML=n+'<button data-s="'+s+'" title="Chọn / bỏ chọn cả ca">Chọn hết</button>';tr.appendChild(th)});
 tr.querySelectorAll("button").forEach(function(b){b.onclick=function(){
  var s=+b.dataset.s,k=key(cy,cm,cd),r=get(k),all=cnt(r,s)===N,patch={};
  for(var i=0;i<N;i++){var ck=i+"-"+s;if(all){delete r.c[ck];patch[ck]=del()}else{r.c[ck]=true;patch[ck]=true}}
  push(k,{c:patch});render()}});
}
function renderDays(){
 var box=document.getElementById("days"),n=dim(cy,cm);box.innerHTML="";
 for(var d=1;d<=n;d++){
  var el=document.createElement("div");el.className="d"+(d===cd?" sel":"")+(key(cy,cm,d)===key(now.getFullYear(),now.getMonth(),now.getDate())?" today":"");
  el.tabIndex=0;el.setAttribute("role","button");
  var w=new Date(cy,cm,d).getDay();
  el.innerHTML="<small>"+WD[w]+"</small><b>"+d+'</b><i><span style="width:'+pct(peek(key(cy,cm,d))).toFixed(0)+'%"></span></i>';
  (function(dd){el.onclick=function(){cd=dd;render()};el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();cd=dd;render()}}})(d);
  box.appendChild(el);
 }
 var sel=box.querySelector(".sel");if(sel&&sel.scrollIntoView)try{box.scrollLeft=sel.offsetLeft-box.clientWidth/2+23}catch(e){}
}
function renderTable(){
 var r=get(key(cy,cm,cd)),b=document.getElementById("body");b.innerHTML="";
 var tr=document.createElement("tr");
 tr.innerHTML='<td class="sl">Doanh thu / số tờ note</td>';
 for(var s=0;s<4;s++){var td=document.createElement("td");td.className="rev";
  td.innerHTML='<input inputmode="numeric" placeholder="Doanh thu" aria-label="Doanh thu '+SH[s]+'" data-k="rev" data-s="'+s+'" value="'+(r.rev[s]?num(r.rev[s]).toLocaleString("vi-VN"):"")+'"><input inputmode="numeric" placeholder="Số tờ note" aria-label="Số tờ note '+SH[s]+'" data-k="note" data-s="'+s+'" value="'+(r.note[s]||"")+'">';
  tr.appendChild(td)}
 b.appendChild(tr);
 ITEMS.forEach(function(name,i){
  var t=document.createElement("tr"),h="<td>"+name+"</td>";
  for(var s=0;s<4;s++)h+='<td><input type="checkbox" data-i="'+i+'" data-s="'+s+'" aria-label="'+name+" - "+SH[s]+'"'+(r.c[i+"-"+s]?" checked":"")+"></td>";
  t.innerHTML=h;b.appendChild(t)});
 b.querySelectorAll("input[type=checkbox]").forEach(function(c){c.onchange=function(){
  var ck=c.dataset.i+"-"+c.dataset.s,dk=key(cy,cm,cd),rr=get(dk),patch={};
  if(c.checked){rr.c[ck]=true;patch[ck]=true}else{delete rr.c[ck];patch[ck]=del()}
  push(dk,{c:patch});renderStats()}});
 b.querySelectorAll("td.rev input").forEach(function(inp){
  inp.onblur=function(){
   var s=inp.dataset.s,f=inp.dataset.k,dk=key(cy,cm,cd),rr=get(dk),v=String(num(inp.value));
   if(v==="0")v="";
   if(f==="rev")fmtIn(inp);else inp.value=v;
   if((rr[f][s]||"")===v)return renderStats();
   if(v)rr[f][s]=v;else delete rr[f][s];
   var o={};o[s]=v||del();var patch={};patch[f]=o;
   push(dk,patch);renderStats()}});
}
function renderStats(){
 var k=key(cy,cm,cd),r=get(k),p=pct(r),tot=0,h="";
 for(var s=0;s<4;s++)tot+=cnt(r,s);
 document.getElementById("dtitle").textContent="Ngày "+p2(cd)+"/"+p2(cm+1)+"/"+cy;
 document.getElementById("dsum").textContent=tot+"/"+N*4+" mục";
 document.getElementById("sdate").textContent=WD[new Date(cy,cm,cd).getDay()]+", "+p2(cd)+"/"+p2(cm+1);
 h+='<div class="big">'+p.toFixed(0)+'%</div><div class="sub">hoàn tất trong ngày ('+tot+" / "+N*4+" mục)</div>";
 for(s=0;s<4;s++){var c=cnt(r,s);h+='<div class="shift"><div class="t"><span>'+SH[s]+"</span><span>"+c+"/"+N+'</span></div><div class="bar"><span style="width:'+(c/N*100)+'%"></span></div></div>'}
 var notes=0;for(s=0;s<4;s++)notes+=num(r.note[s]);
 h+='<div class="kv"><span>Doanh thu cả ngày</span><b>'+money(revOf(r))+'</b></div><div class="kv"><span>Tổng số tờ note</span><b>'+notes+"</b></div>";
 var miss=[];for(var i=0;i<N;i++){var any=false;for(s=0;s<4;s++)if(r.c[i+"-"+s])any=true;if(!any)miss.push(ITEMS[i])}
 h+='<div class="miss">'+(miss.length?"Chưa làm trong ngày ("+miss.length+"): "+miss.slice(0,6).join(", ")+(miss.length>6?"…":""):"Mọi món đều đã được làm ít nhất một ca.")+"</div>";
 document.getElementById("dstats").innerHTML=h;
 // month
 var n=dim(cy,cm),ch=document.getElementById("chart"),sumP=0,done=0,rev=0,best=0,bd=0;ch.innerHTML="";
 for(var d=1;d<=n;d++){var rec=peek(key(cy,cm,d)),pp=pct(rec);if(rec&&pp>0){done++;sumP+=pp}rev+=revOf(rec);
  var rv=revOf(rec);if(rv>best){best=rv;bd=d}
  var el=document.createElement("div");el.title="Ngày "+d+": "+pp.toFixed(0)+"%";el.className=d===cd?"sel":"";
  el.innerHTML='<span style="height:'+pp+'%"></span>';(function(dd){el.onclick=function(){cd=dd;render()}})(d);ch.appendChild(el)}
 document.getElementById("lastd").textContent=n;
 document.getElementById("msum").textContent="Tháng "+p2(cm+1)+"/"+cy;
 document.getElementById("mstats").innerHTML='<div class="kv"><span>Số ngày có ghi nhận</span><b>'+done+"/"+n+'</b></div><div class="kv"><span>Hoàn tất trung bình</span><b>'+(done?(sumP/done).toFixed(0):0)+'%</b></div><div class="kv"><span>Tổng doanh thu tháng</span><b>'+money(rev)+'</b></div><div class="kv"><span>Ngày cao nhất</span><b>'+(bd?"Ngày "+bd+" · "+money(best):"Chưa có")+"</b></div>";
 // update day strip progress without full rebuild
 var chips=document.querySelectorAll("#days .d i span");for(d=1;d<=n;d++)if(chips[d-1])chips[d-1].style.width=pct(peek(key(cy,cm,d))).toFixed(0)+"%";
}
function render(){
 document.getElementById("mlabel").textContent="Tháng "+p2(cm+1)+" / "+cy;
 renderDays();renderTable();renderStats();
}
function shift(m){cm+=m;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}cd=Math.min(cd,dim(cy,cm));listen();render()}
document.getElementById("prev").onclick=function(){shift(-1)};
document.getElementById("next").onclick=function(){shift(1)};
document.getElementById("clr").onclick=function(){if(confirm("Xoá toàn bộ dữ liệu của ngày "+p2(cd)+"/"+p2(cm+1)+"?")){var dk=key(cy,cm,cd);delete store[dk];saveLocal();if(db&&firebase.auth().currentUser)db.collection("days").doc(dk).delete().catch(function(e){setStatus("Không xoá được: "+e.code,false)});render()}};
document.getElementById("exp").onclick=function(){
 var rows=[["Ngày","Hoàn tất %"].concat(SH.map(function(s){return s+" (mục)"}),SH.map(function(s){return "Doanh thu "+s}),SH.map(function(s){return "Số tờ note "+s}),["Tổng doanh thu"])];
 for(var d=1;d<=dim(cy,cm);d++){var r=peek(key(cy,cm,d));rows.push([key(cy,cm,d),pct(r).toFixed(0)].concat([0,1,2,3].map(function(s){return cnt(r,s)}),[0,1,2,3].map(function(s){return r?num(r.rev[s]):0}),[0,1,2,3].map(function(s){return r?num(r.note[s]):0}),[revOf(r)]))}
 var csv="\ufeff"+rows.map(function(x){return x.join(",")}).join("\n");
 var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="checklist-"+cy+"-"+p2(cm+1)+".csv";a.click()};
buildHead();render();initFB();
</script>
</body>
</html>
