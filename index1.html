<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist nấu &amp; chuẩn bị trong ca</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ec;--surf:#fff;--ink:#1b2620;--mute:#66726b;--line:#dadfd8;--acc:#1f5c40;--acc-h:#184a34;--acc-s:#e1eee6;--warn:#b9711a;--warn-s:#fbefd9;--danger:#b3372f;--row:#f5f7f3;--shadow:0 1px 2px rgba(20,35,27,.06),0 4px 14px rgba(20,35,27,.04);
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121714;--surf:#1a211d;--ink:#e7ece8;--mute:#93a099;--line:#2e3832;--acc:#58b385;--acc-h:#6cc597;--acc-s:#213a2d;--warn:#e0a24f;--warn-s:#3a2e18;--danger:#e0716a;--row:#202823;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121714;--surf:#1a211d;--ink:#e7ece8;--mute:#93a099;--line:#2e3832;--acc:#58b385;--acc-h:#6cc597;--acc-s:#213a2d;--warn:#e0a24f;--warn-s:#3a2e18;--danger:#e0716a;--row:#202823;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.d:focus-visible,.stab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* top bar */
.top{background:var(--surf);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:38px;height:38px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:22px;height:22px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--row);border:1px solid var(--line);color:var(--mute);margin-top:4px}
.chip.ok{color:var(--acc);background:var(--acc-s);border-color:transparent}
.nav{display:flex;align-items:center;gap:4px;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:3px}
.nav button{border:0;background:transparent;border-radius:7px;width:34px;height:32px;font-size:18px;line-height:1}
.nav button:hover{background:var(--surf)}
.month{min-width:128px;text-align:center;font-weight:600;font-size:14px}

.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 56px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px}
.d{flex:0 0 auto;width:48px;padding:7px 0 6px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer;position:relative;user-select:none}
.d b{display:block;font-size:15px;line-height:1.2}.d small{color:var(--mute);font-size:11px}
.d i{display:block;height:4px;margin:5px 7px 0;border-radius:2px;background:var(--line);overflow:hidden}
.d i span{display:block;height:100%;background:var(--acc)}
.d.sel{background:var(--acc);border-color:var(--acc);color:#fff}.d.sel small{color:#d5e9dd}.d.sel i{background:rgba(255,255,255,.3)}.d.sel i span{background:#fff}
.d.today:not(.sel){border-color:var(--warn)}
.d.dirty::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card>h2{font-size:14px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600;letter-spacing:.01em}
.card>h2 span{font-weight:400;color:var(--mute);font-size:13px}

/* shift tabs */
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--line);background:var(--row)}
.stab{border:0;background:transparent;padding:11px 8px 10px;text-align:left;border-right:1px solid var(--line);border-bottom:3px solid transparent;position:relative}
.stab:last-child{border-right:0}
.stab .n{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.stab .m{font-size:12px;color:var(--mute);margin-top:1px}
.stab .mb{height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.stab .mb span{display:block;height:100%;background:var(--acc)}
.stab.on{background:var(--surf);border-bottom-color:var(--acc)}
.stab .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:none}
.stab.dirty .dot{display:inline-block}
.stab .ok{display:none;color:var(--acc);font-size:12px}
.stab.saved:not(.dirty) .ok{display:inline}
@media(max-width:520px){.stab{padding:9px 6px}.stab .m{display:none}}

/* shift panel */
.ph{padding:16px 16px 4px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.ph h3{margin:0;font-size:17px}
.ph .sub{margin-top:1px}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.sm{padding:3px 9px;font-size:12px;color:var(--mute)}
.pbar{height:6px;background:var(--line);border-radius:3px;margin:8px 16px 0;overflow:hidden}.pbar span{display:block;height:100%;background:var(--acc);transition:width .2s}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px}
@media(max-width:560px){.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:1/-1}}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surf);font-size:15px}
.fld textarea{resize:vertical;min-height:58px}
.fld.wide{grid-column:1/-1}
.grp{border-top:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--row)}
.gh b{font-size:13px;letter-spacing:.02em}
.gh span{color:var(--mute);font-size:12px;margin-left:8px;font-weight:400}
.items{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;padding:4px 16px 8px}
@media(max-width:560px){.items{grid-template-columns:1fr}}
.it{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.it:last-child{border-bottom:0}
.it input{width:20px;height:20px;accent-color:var(--acc);flex:0 0 auto;cursor:pointer}
.it.on span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}

.sbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surf);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(20,35,27,.06)}
.sbar .st{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.sbar .st i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.sbar.dirty .st{color:var(--warn);font-weight:600}.sbar.dirty .st i{background:var(--warn)}
.sbar.saved:not(.dirty) .st i{background:var(--acc)}
.sbar .acts{display:flex;gap:8px}
.save{border:0;background:var(--acc);color:#fff;border-radius:9px;padding:9px 18px;font-weight:600;font-size:14px}
.save:hover{background:var(--acc-h)}
.save:disabled{opacity:.45;cursor:default}

/* side */
.stats{padding:16px}
.big{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.shift{margin-top:12px}.shift .t{display:flex;justify-content:space-between;font-size:13px}
.bar{height:7px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--acc)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{margin-top:12px}
.kv small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.kv b{text-align:right}
.miss{margin-top:10px;font-size:13px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;padding:14px 16px 0}
.chart div{flex:1;background:var(--acc-s);border-radius:3px 3px 0 0;min-height:2px;position:relative;cursor:pointer;height:100%}
.chart div span{position:absolute;inset:auto 0 0 0;background:var(--acc);border-radius:3px 3px 0 0}
.chart div.sel{outline:2px solid var(--warn)}
.axis{display:flex;justify-content:space-between;padding:4px 16px 12px;font-size:11px;color:var(--mute)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tools .btn.danger{color:var(--danger)}
.note{font-size:12px;color:var(--mute);padding:0 16px 14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1b2620;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger)}
.acts2{display:flex;gap:6px}
.it .q{display:none;width:54px;margin-left:auto;border:1px solid var(--line);border-radius:6px;padding:3px 4px;text-align:center;font-size:14px;background:var(--surf);flex:0 0 auto}
.it.on .q{display:block}
.it>span{flex:1;min-width:0}
.ge{padding:12px 16px;display:grid;gap:8px;background:var(--row)}
.ge .row{display:flex;gap:8px}
.ge input[data-gn],.ge input[data-in]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surf);font-size:15px;width:100%}
.ge .x{border:1px solid var(--line);background:var(--surf);border-radius:8px;width:38px;color:var(--danger);flex:0 0 auto}
.ge .foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:4px}
.addg{display:block;margin:14px 16px 16px;width:calc(100% - 32px);border:1px dashed var(--acc);background:transparent;color:var(--acc);border-radius:10px;padding:10px;font-weight:600;font-size:14px}
.addg:hover{background:var(--acc-s)}
.addg:disabled,.btn:disabled{opacity:.4;cursor:default}
.fq{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.fq em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.fq b{white-space:nowrap}
</style>
</head>
<body>
<div class="top"><div class="top-in">
 <div class="brand">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>
  <div><h1>Checklist nấu &amp; chuẩn bị trong ca</h1><div class="sub">Điền từng ca rồi bấm “Lưu ca” để ghi nhận.</div><div class="chip" id="status"></div></div>
 </div>
 <div class="nav"><button id="prev" aria-label="Tháng trước">‹</button><div class="month" id="mlabel"></div><button id="next" aria-label="Tháng sau">›</button></div>
</div></div>

<div class="wrap">
<div class="days" id="days"></div>
<div class="grid">
 <div class="card">
  <h2><span style="color:var(--ink);font-weight:600" id="dtitle"></span><span id="dsum"></span></h2>
  <div class="stabs" id="stabs"></div>
  <div id="panel"></div>
 </div>
 <div>
  <div class="card"><h2>Thống kê ngày <span id="sdate"></span></h2><div class="stats" id="dstats"></div><div class="note">Chỉ tính số liệu đã bấm “Lưu ca”.</div></div>
  <div class="card" style="margin-top:16px"><h2>Cả tháng <span id="msum"></span></h2>
   <div class="chart" id="chart"></div><div class="axis"><span>1</span><span id="lastd"></span></div>
   <div class="stats" style="padding-top:0" id="mstats"></div>
  </div>
  <div class="tools"><button class="btn danger" id="clr">Xoá dữ liệu ngày này</button><button class="btn" id="exp">Tải CSV tháng</button></div>
 </div>
</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var DEF_ITEMS=["Cốt trà sữa truyền thống","Cốt trà sữa Oolong","Cốt lục trà sữa","Lục trà","Hồng trà","Cốt trà bí đao","Nước đường trắng","Nước đường cà phê","Kem trứng","Machiato","Phô mai viên","Thạch phô mai cà phê","Thạch trà đào","Sương sáo","Pudding trứng / socola","Panna cotta","Khúc bạch nguyên vị","Khúc bạch phô mai","Khúc bạch trà xanh","Trân châu đen","Nha đam","Thạch trà xanh","Trân châu trắng","Trân châu hoàng kim","Hạt chia ngâm","Hạt đác rim","Dưa lưới ủ đường","Mứt măng cầu xiêm","Sốt khoai môn"];
var DEF_GROUPS=[["Cốt trà & trà",0,5],["Đường, kem & machiato",6,9],["Phô mai, thạch & pudding",10,15],["Khúc bạch & trân châu đen",16,19],["Topping & nguyên liệu khác",20,28]];
var SH=["Ca sáng","Ca trưa","Ca chiều","Ca khuya"], N=0, WD=["CN","T2","T3","T4","T5","T6","T7"], MKEY="checklist-menu-v1", editing=null, menu=null;
function defMenu(){return {groups:DEF_GROUPS.map(function(g,gi){var it=[];for(var i=g[1];i<=g[2];i++)it.push({id:String(i),name:DEF_ITEMS[i]});return {id:"g"+gi,name:g[0],items:it}})}}
try{menu=JSON.parse(localStorage.getItem(MKEY)||"null")}catch(e){menu=null}
if(!menu||!menu.groups)menu=defMenu();
function flat(){var a=[];menu.groups.forEach(function(g){g.items.forEach(function(it){a.push(it)})});return a}
function recount(){N=flat().length}
recount();
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function cc(c){var n=0;flat().forEach(function(it){if(c[it.id])n++});return n}
function saveMenu(){
 try{localStorage.setItem(MKEY,JSON.stringify(menu))}catch(e){}
 if(canWrite())db.collection("days").doc("_menu").set({json:JSON.stringify(menu),at:Date.now()}).then(function(){toast("Đã lưu danh sách món")}).catch(function(e){toast("Lưu danh sách lên hệ thống lỗi ("+e.code+"). Đã giữ trên máy này.",true)});
 else toast("Đã lưu danh sách món trên máy này");
}
function listenMenu(){
 if(!db)return;
 db.collection("days").doc("_menu").onSnapshot(function(s){
  if(!s.exists)return;
  try{var m=JSON.parse(s.data().json);if(m&&m.groups){menu=m;recount();try{localStorage.setItem(MKEY,JSON.stringify(menu))}catch(e){}if(!editing)render()}}catch(e){}
 },function(){});
}
var store={}, drafts={}, KEY="checklist-ca-v1", db=null, unsub=null, cs=0;
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){store={}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function setStatus(t,ok){var e=$("status");if(e){e.textContent=(ok?"● ":"○ ")+t;e.className="chip"+(ok?" ok":"")}}
var tt=null;function toast(m,err){var e=$("toast");e.textContent=m;e.className="show"+(err?" err":"");clearTimeout(tt);tt=setTimeout(function(){e.className=""},2600)}
function del(){return db?firebase.firestore.FieldValue.delete():null}
function norm(d){return {c:d.c||{},q:d.q||{},rev:d.rev||{},note:d.note||{},staff:d.staff||{},memo:d.memo||{},at:d.at||{}}}
function fresh(){return {c:{},q:{},rev:{},note:{},staff:{},memo:{},at:{}}}
function canWrite(){return !!(db&&firebase.auth().currentUser)}
function push(k,patch){
 saveLocal();
 if(!canWrite())return null;
 return db.collection("days").doc(k).set(patch,{merge:true});
}
function initFB(){
 var cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.apiKey||cfg.apiKey.indexOf("DAN_")===0||typeof firebase==="undefined"){setStatus("Chế độ offline: dữ liệu chỉ lưu trên máy này",false);return}
 try{
  firebase.initializeApp(cfg);db=firebase.firestore();
  firebase.auth().signInAnonymously().catch(function(e){setStatus("Chỉ xem được (đăng nhập ẩn danh lỗi: "+e.code+")",false)});
  setStatus("Đang kết nối…",false);listen();listenMenu();
 }catch(e){db=null;setStatus("Lỗi cấu hình Firebase",false)}
}
function listen(){
 if(!db)return;if(unsub)unsub();
 var FP=firebase.firestore.FieldPath;
 unsub=db.collection("days").where(FP.documentId(),">=",key(cy,cm,1)).where(FP.documentId(),"<=",key(cy,cm,dim(cy,cm)))
 .onSnapshot(function(snap){
  snap.docChanges().forEach(function(ch){if(ch.type==="removed")delete store[ch.doc.id];else store[ch.doc.id]=norm(ch.doc.data())});
  saveLocal();setStatus("Đã đồng bộ, mọi người cùng xem một dữ liệu",true);
  var a=document.activeElement,inP=a&&$("panel").contains(a)&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");
  if(inP){renderDays();renderTabs();renderStats()}else render();
 },function(e){setStatus("Lỗi đồng bộ: "+e.code,false)});
}
var now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
function p2(n){return n<10?"0"+n:""+n}
function key(y,m,d){return y+"-"+p2(m+1)+"-"+p2(d)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function get(k){if(!store[k])store[k]=fresh();var r=store[k];["c","q","rev","note","staff","memo","at"].forEach(function(f){if(!r[f])r[f]={}});return r}
function peek(k){return store[k]||null}
function cnt(rec,s){if(!rec)return 0;var n=0;flat().forEach(function(it){if(rec.c[it.id+"-"+s])n++});return n}
function pct(rec){if(!rec||!N)return 0;var t=0;for(var s=0;s<4;s++)t+=cnt(rec,s);return t/(N*4)*100}
function money(n){return n?n.toLocaleString("vi-VN")+" đ":"0 đ"}
function num(s){return parseInt(String(s==null?"":s).replace(/\D/g,""),10)||0}
function numStr(s){var d=String(s==null?"":s).replace(/\D/g,"");return d===""?"":String(parseInt(d,10))}
function revOf(rec){if(!rec||!rec.rev)return 0;var t=0;for(var s=0;s<4;s++)t+=num(rec.rev[s]);return t}
function fmtMoney(v){var n=num(v);return n?n.toLocaleString("vi-VN"):""}

/* shift data: saved vs draft */
function saved(k,s){
 var r=store[k]||fresh(),c={},q={};
 flat().forEach(function(it){var ck=it.id+"-"+s;if(r.c&&r.c[ck]){c[it.id]=true;if(r.q&&r.q[ck])q[it.id]=r.q[ck]}});
 return {c:c,q:q,rev:(r.rev&&r.rev[s])||"",note:(r.note&&r.note[s]!=null)?String(r.note[s]):"",staff:(r.staff&&r.staff[s])||"",memo:(r.memo&&r.memo[s])||"",at:(r.at&&r.at[s])||0};
}
function isDirty(k,s){return !!(drafts[k]&&drafts[k][s])}
function dayDirty(k){return !!drafts[k]&&Object.keys(drafts[k]).length>0}
function cur(k,s){return isDirty(k,s)?drafts[k][s]:saved(k,s)}
function edit(k,s){if(!drafts[k])drafts[k]={};if(!drafts[k][s])drafts[k][s]=saved(k,s);return drafts[k][s]}
function dropDraft(k,s){if(drafts[k]){delete drafts[k][s];if(!Object.keys(drafts[k]).length)delete drafts[k]}}
function size(o){return Object.keys(o).length}
function fmtAt(at){
 if(!at)return "";var d=new Date(at),t=p2(d.getHours())+":"+p2(d.getMinutes());
 var same=d.toDateString()===new Date().toDateString();
 return same?t:t+" "+p2(d.getDate())+"/"+p2(d.getMonth()+1);
}

function saveShift(){
 var k=key(cy,cm,cd),s=cs;
 if(!isDirty(k,s)){toast("Ca này chưa có thay đổi để lưu");return}
 var d=drafts[k][s],r=get(k),t=Date.now(),P={c:{},q:{},rev:{},note:{},staff:{},memo:{},at:{}};
 flat().forEach(function(it){var ck=it.id+"-"+s;
  if(d.c[it.id]){r.c[ck]=true;P.c[ck]=true;var qn=d.q&&d.q[it.id];if(qn>1){r.q[ck]=qn;P.q[ck]=qn}else{delete r.q[ck];P.q[ck]=del()}}
  else{delete r.c[ck];P.c[ck]=del();delete r.q[ck];P.q[ck]=del()}});
 function setF(f,v){if(v){r[f][s]=v;P[f][s]=v}else{delete r[f][s];P[f][s]=del()}}
 var rv=num(d.rev),nt=numStr(d.note);
 setF("rev",rv?String(rv):"");setF("note",nt);
 setF("staff",String(d.staff||"").trim());setF("memo",String(d.memo||"").trim());
 r.at[s]=t;P.at[s]=t;
 dropDraft(k,s);
 var p=push(k,P),name=SH[s];
 if(p){p.then(function(){toast("Đã lưu "+name.toLowerCase()+" lên hệ thống")}).catch(function(e){toast("Lưu lên hệ thống lỗi ("+e.code+"). Đã giữ trên máy này.",true)})}
 else toast(db?"Chưa kết nối được máy chủ, "+name.toLowerCase()+" mới lưu trên máy này":"Đã lưu "+name.toLowerCase()+" trên máy này");
 renderPanel();renderTabs();renderDays();renderStats();
}

/* rendering */
function renderDays(){
 var box=$("days"),n=dim(cy,cm),td=new Date(),tk=key(td.getFullYear(),td.getMonth(),td.getDate());box.innerHTML="";
 for(var d=1;d<=n;d++){
  var k=key(cy,cm,d),el=document.createElement("div");
  el.className="d"+(d===cd?" sel":"")+(k===tk?" today":"")+(dayDirty(k)?" dirty":"");
  el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","Ngày "+d);
  el.innerHTML="<small>"+WD[new Date(cy,cm,d).getDay()]+"</small><b>"+d+'</b><i><span style="width:'+pct(peek(k)).toFixed(0)+'%"></span></i>';
  (function(dd){el.onclick=function(){cd=dd;render()};el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();cd=dd;render()}}})(d);
  box.appendChild(el);
 }
 var sel=box.querySelector(".sel");if(sel)try{box.scrollLeft=sel.offsetLeft-box.clientWidth/2+24}catch(e){}
}
function renderTabs(){
 var k=key(cy,cm,cd),h="";
 for(var s=0;s<4;s++){
  var v=cur(k,s),c=cc(v.c),sv=saved(k,s),dt=isDirty(k,s);
  h+='<button class="stab'+(s===cs?" on":"")+(dt?" dirty":"")+(sv.at?" saved":"")+'" data-s="'+s+'" role="tab" aria-selected="'+(s===cs)+'">'
   +'<div class="n">'+SH[s]+' <span class="dot" title="Chưa lưu"></span><span class="ok">✓</span></div>'
   +'<div class="m">'+c+"/"+N+" mục"+(dt?" · chưa lưu":"")+'</div><div class="mb"><span style="width:'+(c/N*100)+'%"></span></div></button>';
 }
 $("stabs").innerHTML=h;
 $("stabs").querySelectorAll(".stab").forEach(function(b){b.onclick=function(){cs=+b.dataset.s;renderTabs();renderPanel()}});
}
function renderBar(){
 var k=key(cy,cm,cd),s=cs,dt=isDirty(k,s),sv=saved(k,s),bar=$("sbar");if(!bar)return;
 bar.className="sbar"+(dt?" dirty":"")+(sv.at?" saved":"");
 var by=sv.staff?" · "+esc(sv.staff):"";
 $("sbtxt").innerHTML=dt?"Có thay đổi chưa lưu":(sv.at?"Đã lưu lúc "+fmtAt(sv.at)+by:"Ca này chưa được lưu");
 $("sbsave").disabled=!dt;$("sbrev").style.display=dt?"":"none";
}
function renderCount(){
 var k=key(cy,cm,cd),v=cur(k,cs),c=cc(v.c);
 if($("pcount"))$("pcount").textContent=c+" / "+N+" mục đã làm";
 if($("pfill"))$("pfill").style.width=(N?c/N*100:0)+"%";
 document.querySelectorAll(".grp[data-gid]").forEach(function(g){
  var gr=menu.groups.filter(function(x){return x.id===g.dataset.gid})[0],el=g.querySelector(".gc");
  if(!gr||!el)return;var n=0;gr.items.forEach(function(it){if(v.c[it.id])n++});
  el.textContent=n+"/"+gr.items.length;
 });
}
function editHTML(){
 var g=editing,h='<div class="grp ge" data-gid="'+g.id+'"><div class="fld"><label>Tên nhóm</label><input data-gn value="'+esc(g.name)+'" placeholder="Ví dụ: Topping"></div><div class="fld"><label>Các món / topping</label></div>';
 g.items.forEach(function(it,j){h+='<div class="row"><input data-in="'+j+'" value="'+esc(it.name)+'" placeholder="Tên món / topping"><button class="x" data-rm="'+j+'" aria-label="Xoá món">✕</button></div>'});
 h+='<div><button class="btn" data-add>+ Thêm món</button></div><div class="foot"><button class="btn" style="color:var(--danger)" data-delg>'+(g.isNew?"Bỏ nhóm":"Xoá nhóm")+'</button><span><button class="btn" data-cx>Huỷ</button> <button class="save" data-ok>Xong</button></span></div></div>';
 return h;
}
function commitEdit(){
 var g=editing;g.name=String(g.name||"").trim();
 if(!g.name){toast("Hãy nhập tên nhóm",true);return}
 g.items=g.items.map(function(it){return {id:it.id,name:String(it.name||"").trim()}}).filter(function(it){return it.name});
 var isNew=g.isNew;delete g.isNew;
 if(isNew)menu.groups.push(g);else menu.groups=menu.groups.map(function(x){return x.id===g.id?g:x});
 editing=null;recount();saveMenu();render();
}
function renderPanel(){
 var k=key(cy,cm,cd),s=cs,v=cur(k,s),h="",dis=editing?" disabled":"";
 h+='<div class="ph"><div><h3>'+SH[s]+'</h3><div class="sub" id="pcount"></div></div><button class="btn" id="pall"></button></div>';
 h+='<div class="pbar"><span id="pfill"></span></div>';
 h+='<div class="fields">'
  +'<div class="fld"><label for="f-staff">Người phụ trách</label><input id="f-staff" data-f="staff" placeholder="Tên nhân viên" value="'+esc(v.staff)+'"></div>'
  +'<div class="fld"><label for="f-rev">Doanh thu (đ)</label><input id="f-rev" data-f="rev" inputmode="numeric" placeholder="2.500.000" value="'+fmtMoney(v.rev)+'"></div>'
  +'<div class="fld"><label for="f-note">Số tờ note</label><input id="f-note" data-f="note" inputmode="numeric" placeholder="45" value="'+esc(v.note)+'"></div>'
  +'<div class="fld wide"><label for="f-memo">Ghi chú ca</label><textarea id="f-memo" data-f="memo" placeholder="Hết nguyên liệu, sự cố, dặn ca sau…">'+esc(v.memo)+'</textarea></div></div>';
 menu.groups.forEach(function(g){
  if(editing&&!editing.isNew&&editing.id===g.id){h+=editHTML();return}
  h+='<div class="grp" data-gid="'+g.id+'"><div class="gh"><div><b>'+esc(g.name)+'</b><span class="gc"></span></div><div class="acts2"><button class="btn sm" data-ed="'+g.id+'"'+dis+'>Chỉnh sửa</button><button class="btn sm" data-g="'+g.id+'">Chọn nhóm</button></div></div><div class="items">';
  g.items.forEach(function(it){var on=!!v.c[it.id];h+='<label class="it'+(on?" on":"")+'"><input type="checkbox" data-i="'+it.id+'"'+(on?" checked":"")+'><span>'+esc(it.name)+'</span><input class="q" data-q="'+it.id+'" inputmode="numeric" maxlength="3" placeholder="1" value="'+(v.q[it.id]||1)+'" title="Số lượng nấu" aria-label="Số lượng nấu '+esc(it.name)+'"></label>'});
  if(!g.items.length)h+='<div class="sub" style="padding:10px 4px;grid-column:1/-1">Nhóm chưa có món. Bấm “Chỉnh sửa” để thêm.</div>';
  h+='</div></div>';
 });
 if(editing&&editing.isNew)h+=editHTML();
 h+='<button class="addg" id="addg"'+dis+'>+ Thêm nhóm (ví dụ: nhóm Topping)</button>';
 h+='<div class="sbar" id="sbar"><div class="st"><i></i><span id="sbtxt"></span></div><div class="acts"><button class="btn" id="sbrev">Hoàn tác</button><button class="save" id="sbsave">Lưu '+SH[s].toLowerCase()+'</button></div></div>';
 $("panel").innerHTML=h;
 var P=$("panel");
 function allOn(){return N>0&&cc(cur(k,s).c)===N}
 function setAllBtn(){$("pall").textContent=allOn()?"Bỏ chọn hết":"Chọn hết ca"}
 setAllBtn();renderCount();renderBar();
 function touch(){renderCount();renderBar();renderTabs();renderDaysDot()}
 P.querySelectorAll("input[type=checkbox]").forEach(function(c){c.onchange=function(){
  var d=edit(k,s),i=c.dataset.i;if(c.checked)d.c[i]=true;else{delete d.c[i];delete d.q[i]}
  c.closest(".it").classList.toggle("on",c.checked);setAllBtn();touch()}});
 P.querySelectorAll(".q").forEach(function(q){
  q.onclick=function(e){e.stopPropagation()};
  q.oninput=function(){var d=edit(k,s),n=num(q.value),i=q.dataset.q;q.value=n?String(n):"";if(n>1)d.q[i]=n;else delete d.q[i];touch()};
  q.onblur=function(){if(!q.value)q.value="1"};
 });
 P.querySelectorAll("[data-f]").forEach(function(inp){
  inp.oninput=function(){
   var f=inp.dataset.f,d=edit(k,s);
   if(f==="rev"){var n=num(inp.value);inp.value=n?n.toLocaleString("vi-VN"):"";d.rev=n?String(n):""}
   else if(f==="note"){var m=numStr(inp.value);inp.value=m;d.note=m}
   else d[f]=inp.value;
   touch()}});
 $("pall").onclick=function(){
  var d=edit(k,s),on=!allOn();d.c={};d.q={};if(on)flat().forEach(function(it){d.c[it.id]=true});
  P.querySelectorAll("input[type=checkbox]").forEach(function(c){c.checked=on;c.closest(".it").classList.toggle("on",on)});setAllBtn();touch()};
 P.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){
  var g=menu.groups.filter(function(x){return x.id===b.dataset.g})[0],d=edit(k,s),all=g.items.length>0;
  g.items.forEach(function(it){if(!d.c[it.id])all=false});
  g.items.forEach(function(it){if(all){delete d.c[it.id];delete d.q[it.id]}else d.c[it.id]=true});
  P.querySelectorAll("input[type=checkbox]").forEach(function(c){if(g.items.some(function(it){return it.id===c.dataset.i})){c.checked=!!d.c[c.dataset.i];c.closest(".it").classList.toggle("on",c.checked)}});
  setAllBtn();touch()}});
 /* chỉnh sửa nhóm */
 P.querySelectorAll("[data-ed]").forEach(function(b){b.onclick=function(){
  var g=menu.groups.filter(function(x){return x.id===b.dataset.ed})[0];
  editing=JSON.parse(JSON.stringify(g));renderPanel();var f=P.querySelector("[data-gn]");if(f)f.focus()}});
 $("addg").onclick=function(){
  editing={id:uid("g"),name:"",items:[{id:uid("t"),name:""}],isNew:true};renderPanel();
  var f=P.querySelector("[data-gn]");if(f){f.focus();f.scrollIntoView({block:"center"})}};
 var E=P.querySelector(".ge");
 if(E){
  E.querySelector("[data-gn]").oninput=function(){editing.name=this.value};
  E.querySelectorAll("[data-in]").forEach(function(i){i.oninput=function(){editing.items[+i.dataset.in].name=i.value};
   i.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();E.querySelector("[data-add]").click()}}});
  E.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){editing.items.splice(+b.dataset.rm,1);renderPanel()}});
  E.querySelector("[data-add]").onclick=function(){
   editing.items.push({id:uid("t"),name:""});renderPanel();
   var ins=P.querySelectorAll(".ge [data-in]");if(ins.length)ins[ins.length-1].focus()};
  E.querySelector("[data-ok]").onclick=commitEdit;
  E.querySelector("[data-cx]").onclick=function(){editing=null;renderPanel()};
  E.querySelector("[data-delg]").onclick=function(){
   if(editing.isNew){editing=null;renderPanel();return}
   if(!confirm("Xoá nhóm “"+editing.name+"” cùng toàn bộ món trong nhóm? Số liệu cũ của các món này sẽ không còn hiển thị trong thống kê."))return;
   var id=editing.id;menu.groups=menu.groups.filter(function(x){return x.id!==id});editing=null;recount();saveMenu();render()};
 }
 $("sbsave").onclick=saveShift;
 $("sbrev").onclick=function(){if(confirm("Bỏ các thay đổi chưa lưu của "+SH[s].toLowerCase()+"?")){dropDraft(k,s);renderPanel();renderTabs();renderDaysDot()}};
}
function renderDaysDot(){
 var els=document.querySelectorAll("#days .d");
 for(var d=1;d<=els.length;d++)els[d-1].classList.toggle("dirty",dayDirty(key(cy,cm,d)));
}
function renderStats(){
 var k=key(cy,cm,cd),r=peek(k),h="",s,list=[];
 flat().forEach(function(it){var n=0,q=0,det=[];for(s=0;s<4;s++){var ck=it.id+"-"+s;if(r&&r.c[ck]){var qq=(r.q&&r.q[ck])||1;n++;q+=qq;det.push(SH[s].replace("Ca ","")+" ×"+qq)}}if(n)list.push({name:it.name,n:n,q:q,det:det.join(" · ")})});
 list.sort(function(a,b){return b.n-a.n||b.q-a.q});
 $("dtitle").textContent="Ngày "+p2(cd)+"/"+p2(cm+1)+"/"+cy;
 $("dsum").textContent=list.length+" món đã làm";
 $("sdate").textContent=WD[new Date(cy,cm,cd).getDay()]+", "+p2(cd)+"/"+p2(cm+1);
 h+='<div class="big">'+list.length+'</div><div class="sub">món đã làm trong ngày</div>';
 if(list.length){h+='<div style="margin-top:12px">';list.forEach(function(x){h+='<div class="fq"><span>'+esc(x.name)+'<em>'+esc(x.det)+'</em></span><b>'+x.n+' lần</b></div>'});h+='</div>'}
 else h+='<div class="miss">Chưa có món nào được lưu trong ngày.</div>';
 var nt=0,nh='';
 for(s=0;s<4;s++){var nv=(r&&r.note&&r.note[s]!=null)?String(r.note[s]):"";if(nv!==""){nt+=num(nv);nh+='<div class="fq"><span>'+SH[s]+'</span><b>'+num(nv)+' tờ</b></div>'}else nh+='<div class="fq"><span>'+SH[s]+'<em>chưa nhập</em></span><b>—</b></div>'}
 h+='<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line,#eee)"><div class="sub" style="margin-bottom:6px">Số tờ note đã viết trong ngày: <b>'+nt+' tờ</b></div>'+nh+'</div>';
 $("dstats").innerHTML=h;
 var n=dim(cy,cm),ch=$("chart"),sumP=0,done=0,rev=0,best=0,bd=0;ch.innerHTML="";
 for(var d=1;d<=n;d++){var rec=peek(key(cy,cm,d)),pp=pct(rec);if(rec&&pp>0){done++;sumP+=pp}
  var rv=revOf(rec);rev+=rv;if(rv>best){best=rv;bd=d}
  var el=document.createElement("div");el.title="Ngày "+d+": "+pp.toFixed(0)+"%";el.className=d===cd?"sel":"";
  el.innerHTML='<span style="height:'+pp+'%"></span>';(function(dd){el.onclick=function(){cd=dd;render()}})(d);ch.appendChild(el)}
 $("lastd").textContent=n;
 $("msum").textContent="Tháng "+p2(cm+1)+"/"+cy;
 $("mstats").innerHTML='<div class="kv"><span>Số ngày có ghi nhận</span><b>'+done+"/"+n+'</b></div><div class="kv"><span>Hoàn tất trung bình</span><b>'+(done?(sumP/done).toFixed(0):0)+'%</b></div><div class="kv"><span>Tổng doanh thu tháng</span><b>'+money(rev)+'</b></div><div class="kv"><span>Ngày cao nhất</span><b>'+(bd?"Ngày "+bd+" · "+money(best):"Chưa có")+"</b></div>";
 var chips=document.querySelectorAll("#days .d i span");for(d=1;d<=n;d++)if(chips[d-1])chips[d-1].style.width=pct(peek(key(cy,cm,d))).toFixed(0)+"%";
}
function render(){
 $("mlabel").textContent="Tháng "+p2(cm+1)+" / "+cy;
 renderDays();renderTabs();renderPanel();renderStats();
}
function shiftMonth(m){cm+=m;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}cd=Math.min(cd,dim(cy,cm));listen();render()}
$("prev").onclick=function(){shiftMonth(-1)};
$("next").onclick=function(){shiftMonth(1)};
$("clr").onclick=function(){
 if(!confirm("Xoá toàn bộ dữ liệu (kể cả phần chưa lưu) của ngày "+p2(cd)+"/"+p2(cm+1)+"?"))return;
 var dk=key(cy,cm,cd);delete store[dk];delete drafts[dk];saveLocal();
 if(canWrite())db.collection("days").doc(dk).delete().then(function(){toast("Đã xoá dữ liệu ngày")}).catch(function(e){toast("Không xoá được: "+e.code,true)});
 render()};
$("exp").onclick=function(){
 var rows=[["Ngày","Hoàn tất %"].concat(SH.map(function(s){return s+" (mục)"}),SH.map(function(s){return "Doanh thu "+s}),SH.map(function(s){return "Số tờ note "+s}),SH.map(function(s){return "Người phụ trách "+s}),["Tổng doanh thu"])];
 function q(x){return '"'+String(x||"").replace(/"/g,'""')+'"'}
 for(var d=1;d<=dim(cy,cm);d++){var r=peek(key(cy,cm,d));rows.push([key(cy,cm,d),pct(r).toFixed(0)].concat([0,1,2,3].map(function(s){return cnt(r,s)}),[0,1,2,3].map(function(s){return r?num(r.rev[s]):0}),[0,1,2,3].map(function(s){return r?num(r.note[s]):0}),[0,1,2,3].map(function(s){return r?q(r.staff&&r.staff[s]):q("")}),[revOf(r)]))}
 var csv="\ufeff"+rows.map(function(x){return x.join(",")}).join("\n");
 var a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="checklist-"+cy+"-"+p2(cm+1)+".csv";a.click()};
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveShift()}});
window.addEventListener("beforeunload",function(e){for(var k in drafts)if(dayDirty(k)){e.preventDefault();e.returnValue="";return ""}});
(function(){var h=now.getHours();cs=h>=5&&h<11?0:h<15?1:h<22?2:3})();
render();initFB();
</script>
</body>
